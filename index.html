<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bone Strength Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>🦴 Bone Strength</h1>
    <p>Strong today. Strong at 80.</p>
  </header>

  <div class="tabs">
    <button onclick="showDay('dayA', this)" class="active">Workout A</button>
    <button onclick="showDay('dayB', this)">Workout B</button>
  </div>

  <div id="workout" class="workout"></div>

</div>

<script src="app.js"></script>
</body>
</html>
